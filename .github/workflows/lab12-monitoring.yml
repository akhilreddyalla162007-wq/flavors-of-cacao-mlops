
name: Flavors of Cacao - Lab 12 Monitoring

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx psutil fastapi uvicorn

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn api.main:app \
            --host 127.0.0.1 --port 8000 \
            > api_server.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health

      - name: Run Lab 12 monitoring pipeline
        run: |
          python pipelines/run_lab12_monitoring.py

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab12-monitoring-reports
          path: |
            artifacts/api_performance_report.json
            artifacts/data_drift_report.json
            artifacts/model_performance_report.json
            artifacts/retraining_readiness_report.json
            api_server.log
          if-no-files-found: warn
